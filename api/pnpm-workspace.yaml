# 这几个包发布时间太近，被 minimumReleaseAge 拦住了；只放行它们，不关闭整个保护。
# 等它们发布超过保护期之后，可以删掉这段。
minimumReleaseAgeExclude:
  - baseline-browser-mapping
  - browserslist
  - update-browserslist-db
  - minimatch

# pnpm 12 不再读取 package.json 里的 "pnpm" 字段，构建脚本白名单要写在这里
allowBuilds:
  bcrypt: true
  # scarf 只用来上报使用统计，不需要运行它的安装脚本
  '@scarf/scarf': false
