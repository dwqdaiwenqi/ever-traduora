version: '3.7'

services:
  traduora:
    image: everco/ever-traduora:latest
    container_name: traduora
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
    ports:
      - '8080:8080'
    environment:
      TR_SECRET: ${TR_SECRET:-}
      TR_DB_TYPE: mysql
      TR_DB_USER: tr
      TR_DB_PASSWORD: change_me
      TR_DB_DATABASE: tr_dev
      TR_DB_HOST: mysqldb
      TR_DB_PORT: 3306
      NODE_ENV: ${NODE_ENV:-development}
      # Optional sign-in with Ever ID or any other OpenID Connect issuer (off unless 'true'), see docs/configuration.md
      # TR_AUTH_EVERID_ENABLED: 'true'
      # TR_AUTH_EVERID_ISSUER: https://idp.example.com
      # TR_AUTH_EVERID_CLIENT_ID: ${TR_AUTH_EVERID_CLIENT_ID:-}
      # TR_AUTH_EVERID_CLIENT_SECRET: ${TR_AUTH_EVERID_CLIENT_SECRET:-}
      # TR_AUTH_EVERID_REDIRECT_URL: http://localhost:8080/auth/callback
      # TR_AUTH_EVERID_ALLOWED_ISSUERS: ''
      # TR_AUTH_EVERID_PLATFORM_PROJECT_ID: ''
      # TR_AUTH_EVERID_BACKCHANNEL_LOGOUT_ENABLED: 'true'
    entrypoint: './docker-entrypoint.compose.sh'
    restart: on-failure
    depends_on:
      - mysqldb
    networks:
      - overlay

  mysqldb:
    image: mysql:5.7
    container_name: mysqldb
    restart: always
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: tr_dev
      MYSQL_USER: tr
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
    volumes:
      - ./traduora_mysql_data:/var/lib/mysql
    networks:
      - overlay

networks:
  overlay:
    driver: bridge